name: Build Creeperborn

on:
  push:
    branches: [main, 'development/**', 'creeperborn/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: bash gradlew build --stacktrace

      - name: Inspect flight chunk ticket API
        if: failure()
        run: |
          CP=$(find "$HOME/.gradle/caches" -type f -name '*.jar' -printf '%p:')
          javap -classpath "$CP" net.minecraft.server.level.TicketType net.minecraft.server.level.TicketTypes net.minecraft.server.level.ServerChunkCache || true

      - name: Run server regression suite
        timeout-minutes: 5
        run: |
          mkdir -p build/regression-run
          echo 'eula=true' > build/regression-run/eula.txt
          printf 'online-mode=false\nview-distance=2\nsimulation-distance=2\n' > build/regression-run/server.properties
          set -o pipefail
          bash gradlew runRegression --stacktrace 2>&1 | tee build/creeperborn-regression.log
          grep -q CREEPERBORN_REGRESSION_PASSED build/creeperborn-regression.log

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeperborn-regression-log
          path: build/creeperborn-regression.log

      - name: Install client smoke display dependencies
        run: |
          if ! command -v Xvfb >/dev/null || ! dpkg -s libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers libxkbcommon0 libpulse0 libxcursor1 libxi6 >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers libxkbcommon0 libpulse0 libxcursor1 libxi6
          fi

      - name: Run client startup and Phoenix model smoke
        timeout-minutes: 8
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 300s bash gradlew runClientSmoke --stacktrace 2>&1 | tee build/creeperborn-client-smoke.log
          grep -q CREEPERBORN_CLIENT_SMOKE_PASSED build/creeperborn-client-smoke.log

      - name: Upload client smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creeperborn-client-smoke-log
          path: build/creeperborn-client-smoke.log

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Creeperborn-0.1.0-Alpha
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error


