name: Build Night Splitters

on:
  push:
    branches: [main, 'development/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: bash gradlew build --stacktrace

      - name: Run server damage regression
        timeout-minutes: 5
        run: |
          mkdir -p build/regression-run
          echo 'eula=true' > build/regression-run/eula.txt
          printf 'online-mode=false\nview-distance=2\nsimulation-distance=2\n' > build/regression-run/server.properties
          set -o pipefail
          bash gradlew runRegression --stacktrace 2>&1 | tee build/damage-regression.log
          grep -q NIGHT_SPLITTERS_DAMAGE_REGRESSION_PASSED build/damage-regression.log

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-regression-log
          path: build/damage-regression.log

      - name: Inspect new encounter API
        run: python3 scripts/inspect_encounter.py

      - name: Upload API inspection
        uses: actions/upload-artifact@v4
        with:
          name: encounter-api
          path: build/api-inspect

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: Night-Splitters-Test-Build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

